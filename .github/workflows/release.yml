name: Release

# After a merge to main, build signed release APKs and publish/refresh a single
# rolling "latest" GitHub Release with the per-ABI APKs attached.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;29.0.14206865'

      - name: Install controller and agent dependencies
        run: |
          python -m pip install --requirement tools/requirements.txt
          npm ci

      - name: Build reproducible Frida agents
        run: python tools/build_frida_agents.py

      - name: Build signed release
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PW: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUNDLED: ${{ vars.BUNDLED_GADGET_URL_TEMPLATE }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$KS"
            export FRIDABOX_RELEASE_STORE_PASSWORD="$KS_PW"
            export FRIDABOX_RELEASE_KEY_ALIAS="$KEY_ALIAS"
            export FRIDABOX_RELEASE_KEY_PASSWORD="$KEY_PW"
          else
            echo "No signing secret set; generating an ephemeral release keystore."
            PW="palka-ci-$RANDOM$RANDOM"
            keytool -genkeypair -keystore "$KS" -storepass "$PW" -keypass "$PW" \
              -alias palka -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Palka, O=Palka, C=ID"
            export FRIDABOX_RELEASE_STORE_PASSWORD="$PW"
            export FRIDABOX_RELEASE_KEY_ALIAS="palka"
            export FRIDABOX_RELEASE_KEY_PASSWORD="$PW"
          fi
          export FRIDABOX_RELEASE_STORE_FILE="$KS"
          ARGS=()
          if [ -n "${BUNDLED:-}" ]; then ARGS+=("-PbundledGadgetUrlTemplate=$BUNDLED"); fi
          chmod +x gradlew
          ./gradlew :app:assembleRelease "${ARGS[@]}" --stacktrace --console=plain

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t APKS < <(find app/build/outputs/apk/release -name '*.apk' | sort)
          if [ "${#APKS[@]}" -eq 0 ]; then
            echo "No release APKs were produced"; exit 1
          fi
          printf 'APK: %s\n' "${APKS[@]}"
          gh release delete latest --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
          gh release create latest \
            --repo "$GITHUB_REPOSITORY" \
            --title "Palka (latest)" \
            --notes "Auto-built from main @ ${GITHUB_SHA:0:7} on $(date -u +%Y-%m-%d)." \
            --prerelease \
            "${APKS[@]}"
