name: Build Stealth Gadget

# Builds a renamed ("stealth") Frida Gadget for Android from source via
# gadget-builder/. Manual only (workflow_dispatch) — this is a heavy ~hours
# build and must never run on push/PR. Must live on the default branch to be
# dispatchable from the Actions tab.

on:
  workflow_dispatch:
    inputs:
      frida_version:
        description: Frida version tag (e.g. 17.16.0)
        required: true
        type: string
        default: "17.16.0"
      custom_name:
        description: Replacement token; empty = polymorphic per build
        required: false
        type: string
        default: ""
      arch:
        description: Target architectures
        required: true
        type: choice
        default: android-arm64
        options:
          - android-arm64
          - android-arm64,android-arm
          - android-arm64,android-arm,android-x86_64,android-x86
      ndk_version:
        description: Android NDK revision (match frida/releng for the version)
        required: false
        type: string
        default: "r27c"
      verify:
        description: Fail the build if forbidden Frida markers survive
        required: false
        type: boolean
        default: false
      publish_release:
        description: Publish the artifacts as a GitHub release
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-gadget-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write  # needed only when publish_release is true (gh release create)
    steps:
      - name: Check out builder
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Android NDK
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: ${{ inputs.ndk_version }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          DEBIAN_FRONTEND=noninteractive sudo apt-get install --yes \
            build-essential tree ninja-build gcc-multilib g++-multilib \
            flex bison ruby ruby-dev python3-requests python3-setuptools \
            python3-dev python3-pip libc6-dev libc6-dev-i386

      - name: Build stealth gadget
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          STRIP="$(find "$ANDROID_NDK_ROOT" -name 'llvm-strip' | head -n 1)"
          export STRIP
          echo "Using STRIP=$STRIP"
          args=(
            --version "${{ inputs.frida_version }}"
            --arch "${{ inputs.arch }}"
            --output output
          )
          if [ -n "${{ inputs.custom_name }}" ]; then
            args+=(--name "${{ inputs.custom_name }}")
          fi
          if [ "${{ inputs.verify }}" = "true" ]; then
            args+=(--verify)
          fi
          cd gadget-builder
          python3 build.py "${args[@]}"
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp -r output/* "$GITHUB_WORKSPACE/output/" 2>/dev/null || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: stealth-gadget
          path: gadget-builder/output/
          if-no-files-found: error
          retention-days: 14

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd gadget-builder/output
          name=$(python3 -c "import json;print(json.load(open('build-info.json'))['name'])")
          tag="stealth-${{ inputs.frida_version }}-${name}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Stealth Gadget ${{ inputs.frida_version }} (${name})" \
            --notes "Renamed Frida Gadget built from source by gadget-builder. See build-info.json." \
            *.so.gz build-info.json SHA256SUMS
